<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes | Floricultura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/clientes.css" />
  </head>
  <body>
    <main class="clients-page">
      <header class="page-header">
        <div><p class="eyebrow">Relacionamento</p><h1>Clientes</h1><p class="page-intro">Mantenha os contatos da floricultura prontos para o próximo pedido.</p></div>
      </header>

      <div class="clients-layout">
        <section class="client-form-panel" aria-labelledby="form-title">
          <p class="eyebrow">Novo cadastro</p><h2 id="form-title">Adicionar cliente</h2>
          <form id="formCliente">
            <input type="hidden" id="cliente-id" />
            <label for="nome">Nome completo</label><input type="text" id="nome" required />
            <label for="cpfCnpj">CPF ou CNPJ</label><input type="text" id="cpfCnpj" />
            <label for="email">E-mail</label><input type="email" id="email" />
            <label for="telefone">Telefone / WhatsApp</label><input type="text" id="telefone" />
            <label for="endereco">Endereço</label><input type="text" id="endereco" />
            <p id="form-feedback" class="feedback" role="alert"></p>
            <button class="primary-button" type="submit">Salvar cliente</button>
          </form>
        </section>

        <section class="clients-surface" aria-labelledby="list-title">
          <div class="surface-heading"><div><p class="eyebrow">Base de contatos</p><h2 id="list-title">Clientes cadastrados</h2></div><span id="client-count" class="client-count"></span></div>
          <p id="list-feedback" class="feedback" role="status"></p>
          <div class="table-wrap"><table><thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th>E-mail</th><th>Ações</th></tr></thead><tbody id="tabelaClientesBody"></tbody></table></div>
        </section>
      </div>
    </main>
    <script src="../../services/utils.js"></script><script src="../../services/authService.js"></script>
    <script src="./clientes.js"></script>
  </body>
</html>
