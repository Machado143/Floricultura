{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Flor & Cia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'loja/css/style.css' %}" />
    <style>
        body { margin: 0; font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #efe7ff, #f9f5ff); }
        .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
        .login-box { background: white; border-radius: 24px; box-shadow: 0 22px 60px rgba(109, 76, 197, 0.12); width: min(440px, 100%); padding: 2rem; }
        .login-box h1 { text-align: center; margin-bottom: 1.5rem; }
        .field { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
        input { border: 1px solid #e4e4e4; border-radius: 12px; padding: .8rem .9rem; }
        .btn { display: inline-flex; width: 100%; justify-content: center; border: none; padding: .9rem; border-radius: 999px; background: linear-gradient(135deg, #6d4cc5, #8d6ae7); color: white; font-weight: 700; }
        .alert { background: #efe7ff; color: #472c8f; padding: .85rem 1rem; border-radius: 12px; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-box">
        <h1>Flor & Cia</h1>
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required />
            </div>
            <div class="field">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required />
            </div>
            <button class="btn" type="submit">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>
