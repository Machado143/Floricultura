{% extends 'base_interno.html' %}

{% block title %}{% if planta %}Editar planta{% else %}Nova planta{% endif %}{% endblock %}

{% block content %}
<div class="card">
    <h2>{% if planta %}Editar planta{% else %}Nova planta{% endif %}</h2>

    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            <div class="field">
                <label>Nome popular</label>
                <input type="text" name="nome_popular" value="{{ planta.nome_popular|default:'' }}" required />
            </div>
            <div class="field">
                <label>Nome científico</label>
                <input type="text" name="nome_cientifico" value="{{ planta.nome_cientifico|default:'' }}" />
            </div>
            <div class="field">
                <label>Categoria</label>
                <input type="text" name="categoria_nome" value="{{ planta.categoria.nome|default:'' }}" />
            </div>
            <div class="field">
                <label>Slug da categoria</label>
                <input type="text" name="categoria_slug" value="{{ planta.categoria.slug|default:'' }}" />
            </div>
            <div class="field">
                <label>Preço</label>
                <input type="number" step="0.01" name="preco" value="{{ planta.preco|default:'0' }}" required />
            </div>
            <div class="field">
                <label>Estoque atual</label>
                <input type="number" name="estoque_atual" value="{{ planta.estoque_atual|default:'0' }}" />
            </div>
            <div class="field">
                <label>Estoque mínimo</label>
                <input type="number" name="estoque_minimo" value="{{ planta.estoque_minimo|default:'5' }}" />
            </div>
            <div class="field">
                <label>Imagem URL</label>
                <input type="url" name="imagem_url" value="{{ planta.imagem_url|default:'' }}" />
            </div>
            <div class="field">
                <label>Luminosidade</label>
                <input type="text" name="luminosidade" value="{{ planta.luminosidade|default:'' }}" />
            </div>
            <div class="field">
                <label>Rega</label>
                <input type="text" name="rega" value="{{ planta.rega|default:'' }}" />
            </div>
            <div class="field">
                <label>Temperatura</label>
                <input type="text" name="temperatura" value="{{ planta.temperatura|default:'' }}" />
            </div>
            <div class="field">
                <label>Toxicidade para pets</label>
                <input type="text" name="toxicidade_pet" value="{{ planta.toxicidade_pet|default:'' }}" />
            </div>
            <div class="field">
                <label>Porte</label>
                <input type="text" name="porte" value="{{ planta.porte|default:'' }}" />
            </div>
            <div class="field">
                <label>Dificuldade</label>
                <input type="text" name="dificuldade" value="{{ planta.dificuldade|default:'' }}" />
            </div>
            <div class="field">
                <label>Ativa</label>
                <input type="checkbox" name="ativo" {% if planta.ativo %}checked{% endif %} />
            </div>
            <div class="field">
                <label>Destaque</label>
                <input type="checkbox" name="destaque" {% if planta.destaque %}checked{% endif %} />
            </div>
            <div class="field" style="grid-column:1/-1;">
                <label>Descrição</label>
                <textarea name="descricao">{{ planta.descricao|default:'' }}</textarea>
            </div>
            <div class="field" style="grid-column:1/-1;">
                <label>Guia de cuidados</label>
                <textarea name="guia_cuidados">{{ planta.guia_cuidados|default:'' }}</textarea>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Salvar</button>
    </form>
</div>
{% endblock %}
